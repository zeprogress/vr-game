<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZEP GAME — Инвентарь</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #14161f;
        color: #dfe4f0;
        font-family: system-ui, sans-serif;
        padding: 20px 16px 60px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .sub {
        opacity: 0.6;
        font-size: 13px;
        margin-bottom: 20px;
      }
      .card {
        max-width: 640px;
        margin: 0 auto;
      }
      .weapon {
        background: #2a2e40;
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .weapon .name {
        font-weight: 700;
      }
      .weapon.legendary .name,
      .hand.legendary .hand-name {
        color: #c77dff;
      }
      .weapon.gold .name,
      .hand.gold .hand-name {
        color: #ffd24a;
      }
      .weapon .affixes,
      .quality {
        color: #f2c74b;
        font-weight: 600;
        font-size: 0.9em;
      }
      .hand .affixes {
        color: #7db8ff;
        font-size: 13px;
        margin-top: 2px;
      }
      .weapon .meta {
        font-size: 12px;
        opacity: 0.55;
        white-space: nowrap;
        text-align: right;
      }
      .badge {
        display: inline-block;
        background: rgba(76, 175, 80, 0.25);
        color: #7ee081;
        border-radius: 5px;
        padding: 1px 6px;
        font-size: 11px;
        margin-top: 4px;
      }
      .empty,
      .error {
        opacity: 0.6;
        padding: 20px 0;
      }
      .section {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.55;
        margin: 22px 0 10px;
      }
      .section:first-child {
        margin-top: 0;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px 12px;
        background: #2a2e40;
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
      }
      .stat-label {
        opacity: 0.6;
      }
      .stat-value {
        font-weight: 700;
      }
      .hands {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 4px;
      }
      .hand {
        flex: 1 1 220px;
        background: #2a2e40;
        border-radius: 8px;
        padding: 10px 14px;
      }
      .hand.empty-hand {
        opacity: 0.5;
      }
      .hand-label {
        opacity: 0.6;
        font-size: 12px;
      }
      .hand-name {
        font-weight: 700;
      }
      .misc {
        background: #2a2e40;
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 6px;
      }
      .auth {
        background: #2d2640;
        border: 1px solid #7a5cff;
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 14px;
        text-align: center;
        line-height: 1.5;
      }
      .auth .code {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 0.25em;
        color: #ffe08a;
        margin: 6px 0;
        font-variant-numeric: tabular-nums;
      }
      .auth-note {
        font-size: 12px;
        opacity: 0.6;
      }
      .weapon .winfo {
        min-width: 0;
      }
      .weapon .meta {
        text-align: left;
        margin-top: 2px;
      }
      .btns {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex-shrink: 0;
      }
      button.act {
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        color: #fff;
        min-width: 96px;
      }
      button.act.equip {
        background: #3f7d4a;
      }
      button.act.scrap {
        background: #5a4a3a;
      }
      button.act.scrap.armed {
        background: #b0452f;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translate(-50%, 40px);
        opacity: 0;
        transition: all 0.2s;
        background: #2f6b3a;
        color: #fff;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        max-width: calc(100% - 32px);
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #toast.bad {
        background: #8a3a2f;
      }
      .pickable {
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.15s;
      }
      .pickable:hover {
        box-shadow: 0 0 0 1px #ffd24a88;
      }
      .pickable:active {
        transform: scale(0.99);
      }
      #ench {
        position: fixed;
        inset: 0;
        background: rgba(5, 6, 12, 0.72);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 10;
      }
      #ench.open {
        display: flex;
      }
      .ebox {
        position: relative;
        width: 100%;
        max-width: 460px;
        max-height: calc(100vh - 32px);
        overflow: auto;
        background: linear-gradient(#262a3b, #1b1e2b);
        border: 1px solid #4a4f68;
        border-radius: 12px;
        padding: 18px 16px 14px;
        box-shadow: 0 10px 40px #000a;
      }
      .ebox.legendary {
        border-color: #7b4fb0;
      }
      .ebox.gold {
        border-color: #a8872e;
      }
      .eclose {
        position: absolute;
        right: 10px;
        top: 8px;
        background: none;
        border: none;
        color: #dfe4f0;
        font-size: 18px;
        cursor: pointer;
        opacity: 0.6;
      }
      .etitle {
        font-weight: 800;
        font-size: 17px;
        padding-right: 24px;
      }
      .ebox.legendary .ename {
        color: #c77dff;
      }
      .ebox.gold .ename {
        color: #ffd24a;
      }
      .ehave {
        opacity: 0.8;
        margin: 4px 0 12px;
        font-size: 14px;
      }
      .erow {
        position: relative;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas: "label right" "bar right";
        gap: 6px 12px;
        align-items: center;
        background: #2a2e40;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
        transition: background 0.3s, box-shadow 0.3s;
      }
      .elabel {
        grid-area: label;
        font-weight: 700;
        color: #7db8ff;
      }
      .epts {
        margin-left: 8px;
        font-weight: 600;
        font-size: 12px;
        color: #dfe4f0;
        opacity: 0.55;
      }
      .ebar {
        grid-area: bar;
        height: 8px;
        background: #151722;
        border-radius: 4px;
        overflow: hidden;
      }
      .efill {
        height: 100%;
        background: linear-gradient(90deg, #4a7bd0, #7db8ff);
        border-radius: 4px;
        transition: width 0.8s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .erow.ismax .efill {
        background: linear-gradient(90deg, #d8a526, #ffe08a);
      }
      .eright {
        grid-area: right;
      }
      .maxb {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 6px;
        background: #4a3d12;
        color: #ffe08a;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .ebtn {
        border: none;
        border-radius: 7px;
        padding: 7px 12px;
        background: #8a5a22;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        min-width: 104px;
        line-height: 1.2;
      }
      .ebtn small {
        font-weight: 500;
        opacity: 0.85;
      }
      .ebtn:disabled {
        background: #3a3d4c;
        color: #888;
        cursor: default;
      }
      .eanvil {
        height: 0;
        overflow: hidden;
        text-align: center;
        transition: height 0.2s;
      }
      .ebox.forging .eanvil {
        height: 54px;
      }
      .ehammer {
        font-size: 36px;
        display: inline-block;
        transform-origin: 80% 80%;
      }
      .ebox.forging .ehammer {
        animation: hammer 0.36s ease-in 3;
      }
      @keyframes hammer {
        0% { transform: rotate(-50deg); }
        70% { transform: rotate(15deg); }
        100% { transform: rotate(-50deg); }
      }
      .erow.target {
        box-shadow: 0 0 0 2px #ffb04a, 0 0 18px #ff8a2a66;
      }
      .ebox.forging .erow.target {
        animation: glow 0.36s ease-in-out 3;
      }
      @keyframes glow {
        50% { background: #4a3a2a; }
      }
      .erow.win {
        background: #2b4a2f;
        box-shadow: 0 0 0 2px #7ee081, 0 0 26px #7ee08188;
      }
      .erow.lose {
        background: #4a2a2a;
        box-shadow: 0 0 0 2px #e05a4a;
        animation: shake 0.45s;
      }
      @keyframes shake {
        20%, 60% { transform: translateX(-7px); }
        40%, 80% { transform: translateX(7px); }
      }
      .ebox.win {
        animation: flashwin 0.7s;
      }
      .ebox.lose {
        animation: flashlose 0.6s;
      }
      @keyframes flashwin {
        30% { box-shadow: 0 0 60px #ffe08a; border-color: #ffe08a; }
      }
      @keyframes flashlose {
        30% { box-shadow: 0 0 40px #e05a4a; border-color: #e05a4a; }
      }
      .spark {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ffe08a;
        box-shadow: 0 0 8px #ffb04a;
        pointer-events: none;
        animation: spark 0.9s ease-out forwards;
      }
      @keyframes spark {
        from { transform: translate(0, 0) scale(1); opacity: 1; }
        to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
      }
      .smoke {
        position: absolute;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #8a8f9e;
        filter: blur(4px);
        pointer-events: none;
        animation: smoke 1.3s ease-out forwards;
      }
      @keyframes smoke {
        from { transform: translate(0, 0) scale(0.5); opacity: 0.7; }
        to { transform: translate(var(--dx), var(--dy)) scale(2.2); opacity: 0; }
      }
      .floaty {
        position: absolute;
        right: 12px;
        top: -4px;
        color: #7ee081;
        font-weight: 900;
        font-size: 20px;
        text-shadow: 0 0 8px #000;
        pointer-events: none;
        animation: floaty 1.4s ease-out forwards;
      }
      @keyframes floaty {
        from { transform: translateY(0) scale(0.6); opacity: 0; }
        20% { transform: translateY(-8px) scale(1.2); opacity: 1; }
        to { transform: translateY(-40px) scale(1); opacity: 0; }
      }
      .ebanner {
        text-align: center;
        font-weight: 800;
        font-size: 16px;
        padding: 0;
        max-height: 0;
        overflow: hidden;
        border-radius: 8px;
        transition: all 0.25s;
      }
      .ebanner.show {
        padding: 10px;
        max-height: 80px;
        margin-top: 6px;
      }
      .ebanner small {
        display: block;
        font-weight: 500;
        opacity: 0.8;
        font-size: 12px;
      }
      .ebanner.good {
        background: #2b4a2f;
        color: #b8f5bb;
        animation: pop 0.4s;
      }
      .ebanner.bad {
        background: #4a2a2a;
        color: #ffb4a8;
      }
      @keyframes pop {
        0% { transform: scale(0.7); }
        60% { transform: scale(1.08); }
      }
      .enote {
        font-size: 12px;
        opacity: 0.5;
        margin-top: 10px;
        line-height: 1.4;
      }
      button#mechBtn {
        margin-top: 24px;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: rgba(91, 140, 255, 0.55);
        color: #dff0ff;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
      #mech {
        display: none;
        margin-top: 16px;
        background: #1e2130;
        border-radius: 8px;
        padding: 18px;
        font-size: 17px;
        line-height: 1.6;
      }
      #mech h2 {
        font-size: 19px;
        margin: 20px 0 8px;
        color: #ffe08a;
      }
      #mech h2:first-child {
        margin-top: 0;
      }
      #mech code {
        background: rgba(255, 255, 255, 0.08);
        padding: 1px 5px;
        border-radius: 4px;
      }
      /* Атрибуты — цвет как у полосок характеристик в самой игре. */
      #mech .str {
        color: #ff8a80;
        font-weight: 700;
      }
      #mech .agi {
        color: #7ee081;
        font-weight: 700;
      }
      #mech .int {
        color: #7db8ff;
        font-weight: 700;
      }
      /* Классы — тот же цвет, что и у их ключевого атрибута выше. */
      #mech .cls-warrior {
        color: #ff8a80;
        font-weight: 700;
      }
      #mech .cls-archer {
        color: #7ee081;
        font-weight: 700;
      }
      #mech .cls-mage {
        color: #7db8ff;
        font-weight: 700;
      }
      /* Тиры оружия — те же цвета, что и в списке склада/руках выше. */
      #mech .tier-gold {
        color: #ffd24a;
        font-weight: 700;
      }
      #mech .tier-legendary {
        color: #c77dff;
        font-weight: 700;
      }
      /* Названия роллов аффиксов — тот же голубой, что и текст роллов в карточках. */
      #mech .roll {
        color: #7db8ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">Инвентарь</h1>
      <div class="sub" id="sub">загрузка…</div>
      <div id="list"></div>
      <button id="mechBtn">📖 Механики игры</button>
      <div id="mech"></div>
    </div>
    <div id="toast"></div>
    <div id="ench"></div>
    <script type="module" src="/src/client/inv/main.ts"></script>
  </body>
</html>
