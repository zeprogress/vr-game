<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZEP GAME — Инвентарь</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #14161f;
        color: #dfe4f0;
        font-family: system-ui, sans-serif;
        padding: 20px 16px 60px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .sub {
        opacity: 0.6;
        font-size: 13px;
        margin-bottom: 20px;
      }
      .card {
        max-width: 640px;
        margin: 0 auto;
      }
      .weapon {
        background: #2a2e40;
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .weapon .name {
        font-weight: 700;
      }
      .weapon.legendary .name,
      .hand.legendary .hand-name {
        color: #c77dff;
      }
      .weapon.gold .name,
      .hand.gold .hand-name {
        color: #ffd24a;
      }
      .weapon .affixes,
      .quality {
        color: #f2c74b;
        font-weight: 600;
        font-size: 0.9em;
      }
      .hand .affixes {
        color: #7db8ff;
        font-size: 13px;
        margin-top: 2px;
      }
      .weapon .meta {
        font-size: 12px;
        opacity: 0.55;
        white-space: nowrap;
        text-align: right;
      }
      .badge {
        display: inline-block;
        background: rgba(76, 175, 80, 0.25);
        color: #7ee081;
        border-radius: 5px;
        padding: 1px 6px;
        font-size: 11px;
        margin-top: 4px;
      }
      .empty,
      .error {
        opacity: 0.6;
        padding: 20px 0;
      }
      .section {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.55;
        margin: 22px 0 10px;
      }
      .section:first-child {
        margin-top: 0;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px 12px;
        background: #2a2e40;
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
      }
      .stat-label {
        opacity: 0.6;
      }
      .stat-value {
        font-weight: 700;
      }
      .hands {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 4px;
      }
      .hand {
        flex: 1 1 220px;
        background: #2a2e40;
        border-radius: 8px;
        padding: 10px 14px;
      }
      .hand.empty-hand {
        opacity: 0.5;
      }
      .hand-label {
        opacity: 0.6;
        font-size: 12px;
      }
      .hand-name {
        font-weight: 700;
      }
      .misc {
        background: #2a2e40;
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 6px;
      }
      .auth {
        background: #2d2640;
        border: 1px solid #7a5cff;
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 14px;
        text-align: center;
        line-height: 1.5;
      }
      .auth .code {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 0.25em;
        color: #ffe08a;
        margin: 6px 0;
        font-variant-numeric: tabular-nums;
      }
      .auth-note {
        font-size: 12px;
        opacity: 0.6;
      }
      .weapon .winfo {
        min-width: 0;
      }
      .weapon .meta {
        text-align: left;
        margin-top: 2px;
      }
      .btns {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex-shrink: 0;
      }
      button.act {
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        color: #fff;
        min-width: 96px;
      }
      button.act.equip {
        background: #3f7d4a;
      }
      button.act.scrap {
        background: #5a4a3a;
      }
      button.act.scrap.armed {
        background: #b0452f;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translate(-50%, 40px);
        opacity: 0;
        transition: all 0.2s;
        background: #2f6b3a;
        color: #fff;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        max-width: calc(100% - 32px);
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #toast.bad {
        background: #8a3a2f;
      }
      button#mechBtn {
        margin-top: 24px;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: rgba(91, 140, 255, 0.55);
        color: #dff0ff;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
      #mech {
        display: none;
        margin-top: 16px;
        background: #1e2130;
        border-radius: 8px;
        padding: 18px;
        font-size: 17px;
        line-height: 1.6;
      }
      #mech h2 {
        font-size: 19px;
        margin: 20px 0 8px;
        color: #ffe08a;
      }
      #mech h2:first-child {
        margin-top: 0;
      }
      #mech code {
        background: rgba(255, 255, 255, 0.08);
        padding: 1px 5px;
        border-radius: 4px;
      }
      /* Атрибуты — цвет как у полосок характеристик в самой игре. */
      #mech .str {
        color: #ff8a80;
        font-weight: 700;
      }
      #mech .agi {
        color: #7ee081;
        font-weight: 700;
      }
      #mech .int {
        color: #7db8ff;
        font-weight: 700;
      }
      /* Классы — тот же цвет, что и у их ключевого атрибута выше. */
      #mech .cls-warrior {
        color: #ff8a80;
        font-weight: 700;
      }
      #mech .cls-archer {
        color: #7ee081;
        font-weight: 700;
      }
      #mech .cls-mage {
        color: #7db8ff;
        font-weight: 700;
      }
      /* Тиры оружия — те же цвета, что и в списке склада/руках выше. */
      #mech .tier-gold {
        color: #ffd24a;
        font-weight: 700;
      }
      #mech .tier-legendary {
        color: #c77dff;
        font-weight: 700;
      }
      /* Названия роллов аффиксов — тот же голубой, что и текст роллов в карточках. */
      #mech .roll {
        color: #7db8ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">Инвентарь</h1>
      <div class="sub" id="sub">загрузка…</div>
      <div id="list"></div>
      <button id="mechBtn">📖 Механики игры</button>
      <div id="mech"></div>
    </div>
    <div id="toast"></div>
    <script type="module" src="/src/client/inv/main.ts"></script>
  </body>
</html>
