<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZEP GAME — Инвентарь</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #14161f;
        color: #dfe4f0;
        font-family: system-ui, sans-serif;
        padding: 20px 16px 60px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .sub {
        opacity: 0.6;
        font-size: 13px;
        margin-bottom: 20px;
      }
      .card {
        max-width: 640px;
        margin: 0 auto;
      }
      .error {
        opacity: 0.6;
        padding: 20px 0;
      }
      .auth {
        background: #2d2640;
        border: 1px solid #7a5cff;
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 14px;
        text-align: center;
        line-height: 1.5;
      }
      .auth .code {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 0.25em;
        color: #ffe08a;
        margin: 6px 0;
        font-variant-numeric: tabular-nums;
      }
      .auth-note {
        font-size: 12px;
        opacity: 0.6;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translate(-50%, 40px);
        opacity: 0;
        transition: all 0.2s;
        background: #2f6b3a;
        color: #fff;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        max-width: calc(100% - 32px);
        pointer-events: none;
        /* Над окном инвентаря (.pcinv-root — слой 40): раньше сообщения прятались за ним. */
        z-index: 1000;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #toast.bad {
        background: #8a3a2f;
      }
      button#mechBtn {
        margin-top: 24px;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: rgba(91, 140, 255, 0.55);
        color: #dff0ff;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
      #mech {
        display: none;
        margin-top: 16px;
        background: #1e2130;
        border-radius: 8px;
        padding: 18px;
        font-size: 17px;
        line-height: 1.6;
      }
      #mech h2 {
        font-size: 19px;
        margin: 20px 0 8px;
        color: #ffe08a;
      }
      #mech h2:first-child {
        margin-top: 0;
      }
      #mech code {
        background: rgba(255, 255, 255, 0.08);
        padding: 1px 5px;
        border-radius: 4px;
      }
      /* Атрибуты — цвет как у полосок характеристик в самой игре. */
      #mech .str {
        color: #ff8a80;
        font-weight: 700;
      }
      #mech .agi {
        color: #7ee081;
        font-weight: 700;
      }
      #mech .int {
        color: #7db8ff;
        font-weight: 700;
      }
      /* Классы — тот же цвет, что и у их ключевого атрибута выше. */
      #mech .cls-warrior {
        color: #ff8a80;
        font-weight: 700;
      }
      #mech .cls-archer {
        color: #7ee081;
        font-weight: 700;
      }
      #mech .cls-mage {
        color: #7db8ff;
        font-weight: 700;
      }
      /* Тиры оружия — те же цвета, что и в списке склада/руках выше. */
      #mech .tier-gold {
        color: #ffd24a;
        font-weight: 700;
      }
      #mech .tier-legendary {
        color: #c77dff;
        font-weight: 700;
      }
      #mech .tier-ruby {
        color: var(--tier-ruby);
        font-weight: 700;
      }
      /* Названия роллов аффиксов — тот же голубой, что и текст роллов в карточках. */
      #mech .roll {
        color: #7db8ff;
      }

      /* ---- Тема как у ПК-окон игры (тёмное фэнтези: песочный текст, золото, мягкие карточки) ---- */
      body { background: #100f15; color: #e6e0d0; font-size: 14px; }
      h1 { color: #f1ead6; }
      .sub { color: #8f8a7e; opacity: 1; }
      .card { max-width: 680px; background: rgba(22, 21, 29, 0.96); border-radius: 12px; padding: 16px 18px 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55); }
      .auth { background: #1e2430; border-color: #3f5580; }
      #toast { background: rgba(16, 15, 21, 0.95); color: #f1ead6; }
      /* Шапка/подвал страницы вокруг окна снаряжения. */
      .card.top { position: relative; margin-bottom: 12px; padding-bottom: 12px; }
      .card.foot { margin-top: 14px; }
      .footbtns { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
      .footbtns button, button#mechBtn { margin-top: 0; width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #3a3e48;
        background: #23222b; color: #f1ead6; font: 700 14px system-ui; cursor: pointer; }
      .footbtns button:hover { border-color: #6e7482; }
      #mech, #upd, #help { background: #1d1c25; color: #e6e0d0; }
      #upd { display: none; margin-top: 16px; border-radius: 8px; padding: 14px 18px; font-size: 14px; line-height: 1.5; }
      #mech ul { margin: 2px 0 10px; padding-left: 20px; }
      #mech li { margin: 2px 0; }
      #upd .u { margin-bottom: 14px; }
      #upd .u b { display: block; color: #e8c26a; font-size: 13px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
      #upd ul { margin: 0; padding-left: 18px; }
      #upd li { margin: 2px 0; }
      /* Помощь в разработке: вкладки «Ошибки» / «Предложение», поле, таблица записей. */
      #help { display: none; margin-top: 16px; border-radius: 8px; padding: 14px 16px; font-size: 14px; line-height: 1.5; }
      #help .ftabs { display: flex; gap: 8px; margin-bottom: 10px; }
      #help .ftab { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid #3a3e48; background: #23222b; color: #cfc8b6; font: 700 14px system-ui; cursor: pointer; }
      #help .ftab.on { border-color: #e8c26a; background: #2c2a24; color: #f1ead6; }
      #help .fhint { margin: 0 0 8px; color: #8f8a7e; font-size: 13px; }
      #help textarea { width: 100%; min-height: 84px; resize: vertical; background: #15141b; color: #e6e0d0; border: 1px solid #3a3e48; border-radius: 8px; padding: 10px; font: 14px system-ui; }
      #help textarea:disabled { opacity: 0.5; }
      #help .frow { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 10px; }
      #help .fcount { color: #8f8a7e; font-size: 12px; }
      #help #fSend { padding: 9px 18px; border-radius: 8px; border: 1px solid #3f7a48; background: #16261a; color: #7ee081; font: 700 14px system-ui; cursor: pointer; }
      #help #fSend:disabled { opacity: 0.4; cursor: default; }
      #help .fnote { color: #8f8a7e; font-size: 13px; padding: 2px 0 8px; }
      #help .fnote[hidden] { display: none; }
      #help .ftable-wrap { overflow-x: auto; margin-top: 8px; }
      #help table { width: 100%; border-collapse: collapse; font-size: 13px; }
      #help th { text-align: left; color: #8f8a7e; font-weight: 600; border-bottom: 1px solid #3a3e48; padding: 6px; white-space: nowrap; }
      #help td { vertical-align: top; padding: 8px 6px; border-bottom: 1px solid #2a2930; }
      #help td.fwho { font-weight: 700; color: #f1ead6; border-left: 4px solid #8f8a7e; padding-left: 8px; width: 130px; word-break: break-word; }
      #help .fwhen { color: #8f8a7e; font-size: 12px; font-weight: 400; margin-top: 2px; }
      #help td.ftxt { white-space: pre-wrap; word-break: break-word; min-width: 160px; }
      #help td.fst { width: 230px; }
      #help .fbadge { display: inline-block; max-width: 100%; padding: 2px 8px; border-radius: 10px; border: 1px solid; font-size: 12px; font-weight: 700; line-height: 1.35; white-space: normal; }
      /* Кнопки пометок: все подписи видны сразу, переносятся внутри ячейки; выбранная — залита цветом. */
      #help .fpills { display: flex; flex-wrap: wrap; gap: 4px; }
      #help .fpill { padding: 3px 8px; border-radius: 10px; border: 1px solid var(--c); background: transparent; color: var(--c); font: 700 12px/1.3 system-ui; text-align: left; cursor: pointer; }
      #help .fpill.on { background: var(--c); color: #15141b; }
      #help .fdel { margin-top: 6px; padding: 2px 0; background: none; border: none; color: #e0645a; font: 600 12px system-ui; cursor: pointer; }
      /* Узкий экран: строка становится карточкой — имя, текст и статус друг под другом, ничего не обрезается. */
      @media (max-width: 560px) {
        #help table, #help tbody, #help tr, #help td { display: block; width: 100%; }
        #help thead { display: none; }
        #help tr { border-bottom: 1px solid #2a2930; padding: 8px 0; }
        #help td { border: none; padding: 3px 6px; }
        #help td.fwho { width: auto; border-left-width: 4px; }
        #help td.fst { width: auto; }
      }
    </style>
  </head>
  <body>
    <div class="card top">
      <h1 id="title">Инвентарь</h1>
      <div class="sub" id="sub">загрузка…</div>
      <div id="list"></div>
    </div>
    <div id="invMount"></div>
    <div class="card foot">
      <div class="footbtns">
        <button id="mechBtn">📖 Механики игры</button>
        <button id="updBtn">🆕 Обновления</button>
        <button id="helpBtn">💬 Помощь в разработке</button>
      </div>
      <div id="mech"></div>
      <div id="upd"></div>
      <div id="help"></div>
    </div>
    <div id="toast"></div>
    <script type="module" src="/src/client/inv/main.ts"></script>
  </body>
</html>
