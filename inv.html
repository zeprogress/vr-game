<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZEP GAME — Инвентарь</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #14161f;
        color: #dfe4f0;
        font-family: system-ui, sans-serif;
        padding: 20px 16px 60px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .sub {
        opacity: 0.6;
        font-size: 13px;
        margin-bottom: 20px;
      }
      .card {
        max-width: 640px;
        margin: 0 auto;
      }
      .error {
        opacity: 0.6;
        padding: 20px 0;
      }
      .auth {
        background: #2d2640;
        border: 1px solid #7a5cff;
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 14px;
        text-align: center;
        line-height: 1.5;
      }
      .auth .code {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 0.25em;
        color: #ffe08a;
        margin: 6px 0;
        font-variant-numeric: tabular-nums;
      }
      .auth-note {
        font-size: 12px;
        opacity: 0.6;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translate(-50%, 40px);
        opacity: 0;
        transition: all 0.2s;
        background: #2f6b3a;
        color: #fff;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        max-width: calc(100% - 32px);
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #toast.bad {
        background: #8a3a2f;
      }
      button#mechBtn {
        margin-top: 24px;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: rgba(91, 140, 255, 0.55);
        color: #dff0ff;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
      #mech {
        display: none;
        margin-top: 16px;
        background: #1e2130;
        border-radius: 8px;
        padding: 18px;
        font-size: 17px;
        line-height: 1.6;
      }
      #mech h2 {
        font-size: 19px;
        margin: 20px 0 8px;
        color: #ffe08a;
      }
      #mech h2:first-child {
        margin-top: 0;
      }
      #mech code {
        background: rgba(255, 255, 255, 0.08);
        padding: 1px 5px;
        border-radius: 4px;
      }
      /* Атрибуты — цвет как у полосок характеристик в самой игре. */
      #mech .str {
        color: #ff8a80;
        font-weight: 700;
      }
      #mech .agi {
        color: #7ee081;
        font-weight: 700;
      }
      #mech .int {
        color: #7db8ff;
        font-weight: 700;
      }
      /* Классы — тот же цвет, что и у их ключевого атрибута выше. */
      #mech .cls-warrior {
        color: #ff8a80;
        font-weight: 700;
      }
      #mech .cls-archer {
        color: #7ee081;
        font-weight: 700;
      }
      #mech .cls-mage {
        color: #7db8ff;
        font-weight: 700;
      }
      /* Тиры оружия — те же цвета, что и в списке склада/руках выше. */
      #mech .tier-gold {
        color: #ffd24a;
        font-weight: 700;
      }
      #mech .tier-legendary {
        color: #c77dff;
        font-weight: 700;
      }
      #mech .tier-ruby {
        color: var(--tier-ruby);
        font-weight: 700;
      }
      /* Названия роллов аффиксов — тот же голубой, что и текст роллов в карточках. */
      #mech .roll {
        color: #7db8ff;
      }

      /* ---- Тема как у ПК-окон игры (тёмное фэнтези: песочный текст, золото, мягкие карточки) ---- */
      body { background: #100f15; color: #e6e0d0; font-size: 14px; }
      h1 { color: #f1ead6; }
      .sub { color: #8f8a7e; opacity: 1; }
      .card { max-width: 680px; background: rgba(22, 21, 29, 0.96); border-radius: 12px; padding: 16px 18px 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55); }
      .auth { background: #1e2430; border-color: #3f5580; }
      #toast { background: rgba(16, 15, 21, 0.95); color: #f1ead6; }
      /* Шапка/подвал страницы вокруг окна снаряжения. */
      .card.top { position: relative; margin-bottom: 12px; padding-bottom: 12px; }
      .card.foot { margin-top: 14px; }
      .footbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .footbtns button, button#mechBtn { margin-top: 0; width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #3a3e48;
        background: #23222b; color: #f1ead6; font: 700 14px system-ui; cursor: pointer; }
      .footbtns button:hover { border-color: #6e7482; }
      #mech, #upd { background: #1d1c25; color: #e6e0d0; }
      #upd { display: none; margin-top: 16px; border-radius: 8px; padding: 14px 18px; font-size: 14px; line-height: 1.5; }
      #mech ul { margin: 2px 0 10px; padding-left: 20px; }
      #mech li { margin: 2px 0; }
      #upd .u { margin-bottom: 14px; }
      #upd .u b { display: block; color: #e8c26a; font-size: 13px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
      #upd ul { margin: 0; padding-left: 18px; }
      #upd li { margin: 2px 0; }
    </style>
  </head>
  <body>
    <div class="card top">
      <h1 id="title">Инвентарь</h1>
      <div class="sub" id="sub">загрузка…</div>
      <div id="list"></div>
    </div>
    <div id="invMount"></div>
    <div class="card foot">
      <div class="footbtns">
        <button id="mechBtn">📖 Механики игры</button>
        <button id="updBtn">🆕 Обновления</button>
      </div>
      <div id="mech"></div>
      <div id="upd"></div>
    </div>
    <div id="toast"></div>
    <script type="module" src="/src/client/inv/main.ts"></script>
  </body>
</html>
