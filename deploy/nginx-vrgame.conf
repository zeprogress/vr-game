# nginx-конфиг для VR GAME. Плейсхолдеры __DOMAIN__ и __APPDIR__ подставляет
# deploy/setup.sh. HTTPS-часть (:443, редирект, сертификат) дописывает certbot.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __APPDIR__/dist;
    index index.html;

    # Матчмейкинг Colyseus: POST /matchmake/<метод>/<комната>.
    location /matchmake/ {
        proxy_pass http://127.0.0.1:2567;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket комнаты: путь ровно из двух сегментов — /<processId>/<roomId>.
    # У ассетов во втором сегменте есть точка (index-*.js), под шаблон не попадают.
    location ~ "^/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$" {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Статика клиента (собранный Vite). Всё неизвестное — на index.html.
    location / {
        try_files $uri /index.html;
    }

    # Ассеты со стабильными именами кешируем надолго.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
