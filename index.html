<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ZEP GAME — VR / PC / Mobile</title>
    <script>
      // OBS Browser Source (?spectator=…&obs=1): убираем чёрный фон ещё до
      // загрузки модуля, чтобы в OBS был виден слой-заглушка, а не чёрный экран.
      if (/[?&]obs=1(&|$)/.test(location.search) && /[?&]spectator=/.test(location.search)) {
        document.documentElement.style.setProperty("background", "transparent", "important");
        var s = document.createElement("style");
        s.textContent = "html,body{background:transparent!important}";
        document.head.appendChild(s);
      }
    </script>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
      /* Никакого выделения, дабл-тап-зума, лупы при долгом тапе и подсветки касания. */
      html, body {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #renderCanvas { width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
      /* Экранная лупа iOS при долгом тапе рождается из выделения текста —
         глушим выделение и callout везде, кроме поля ввода ника. */
      *:not(input):not(textarea) {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* Ввод ника — единственное поле, где выделение и печать нужны. */
      input, textarea { -webkit-user-select: text; user-select: text; }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <script>
      // Дабл-тап-зум и iOS-жест «щипок» глушим на корню.
      document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
      for (const t of ["gesturestart", "gesturechange", "gestureend"]) {
        document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
      }
      document.addEventListener(
        "contextmenu",
        (e) => {
          if (!(e.target instanceof HTMLInputElement)) e.preventDefault();
        },
        { passive: false },
      );

      // iOS Safari: экранная лупа при долгом тапе, свайп-назад от края, дабл-тап
      // зум — всё это native-жесты поверх touchstart. Гасим touchstart ТОЛЬКО
      // над игровой поверхностью (canvas и тач-оверлей) — там управление на
      // указательных событиях, они переживают preventDefault. Обычный DOM-UI
      // (вход, пульт, меню) не трогаем — иначе у <button> пропадает click, и
      // кнопка «Играть» на телефоне переставала нажиматься. Лупу в UI и так
      // глушит CSS (user-select/touch-callout: none).
      document.addEventListener(
        "touchstart",
        function (e) {
          var el = e.target;
          if (!el || !el.closest) return;
          if (el.closest("#renderCanvas, .touch-ui") && e.cancelable) e.preventDefault();
        },
        { passive: false, capture: true },
      );
      // Подстраховка от свайпа-назад: держим «лишнюю» запись в истории —
      // свайп съедает её, а popstate тут же возвращает.
      try {
        history.pushState(null, "", location.href);
        window.addEventListener("popstate", function () {
          history.pushState(null, "", location.href);
        });
      } catch (_) {
        /* приватный режим и т.п. — не критично */
      }
    </script>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
